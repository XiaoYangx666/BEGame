name: Verify

on:
  push:
  pull_request:
    branches:
      - master
      - next

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:unit
      # Bundles one-symbol consumers to prove unused components and unused trace
      # stay out of the output; needs dist, so it runs after the build.
      - run: npm run test:treeshake
      - run: npm run pack
